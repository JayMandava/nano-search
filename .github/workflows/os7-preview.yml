name: OS7 cloud preview validation
on:
  push:
    branches: [feat/os7-recreation]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: os7-preview-${{ github.sha }}
  cancel-in-progress: true
jobs:
  validate:
    if: "!contains(github.event.head_commit.message, '[smoke-only]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 tools/release/install_tools.py
      - name: Fast UI regressions before native compilation
        working-directory: app
        run: ./gradlew --no-daemon --max-workers=2 -PunsignedRelease=true -PincludePersonalOverlay=false -Pos7CloudPreview=true :app:testDebugUnitTest -x :app:buildGpuLib --tests ai.nanosearch.launcher.Os7SettingsLayoutTest --tests ai.nanosearch.launcher.InteractionFrameRateTest --tests ai.nanosearch.launcher.Os7PanelSwipeLayoutTest --tests ai.nanosearch.launcher.Os7HomeViewTest
      - name: Test and build isolated public preview
        working-directory: app
        run: ./gradlew --no-daemon --max-workers=2 -PunsignedRelease=true -PincludePersonalOverlay=false -Pos7CloudPreview=true :app:testDebugUnitTest :app:lintPreview :app:assemblePreview
      - name: Verify no private font and record artifact identity
        run: |
          mkdir -p preview
          cp app/app/build/outputs/apk/preview/app-preview.apk preview/Nano-Search-v2-0.9.0-personal.2.apk
          unzip -l preview/*.apk > preview/contents.txt
          if grep -Ei 'porsche|personal/|PORSCHE' preview/contents.txt; then exit 1; fi
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging preview/*.apk > preview/package.txt
          grep "name='ai.nanosearch.launcher.os7personal2'" preview/package.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs preview/*.apk > preview/signature.txt
          (cd preview && sha256sum *.apk > SHA256SUMS.txt)
          printf '%s\n' "$GITHUB_SHA" > preview/commit.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: os7-preview-apk
          path: preview/
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: os7-unit-lint
          path: |
            app/app/build/reports/
            app/app/build/test-results/
  emulator:
    if: "!contains(github.event.head_commit.message, '[smoke-only]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - name: Provision emulator with existing runner licenses
        run: |
          export ANDROID_AVD_HOME="$RUNNER_TEMP/os7-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          test -s "$ANDROID_HOME/licenses/android-sdk-license"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1' 'emulator' 'system-images;android-35;google_apis;x86_64' < /dev/null
          printf 'sdk.dir=%s\ncmake.dir=%s/cmake/3.22.1\n' "$ANDROID_HOME" "$ANDROID_HOME" > app/local.properties
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n os7 -p "$ANDROID_AVD_HOME/os7.avd" -k 'system-images;android-35;google_apis;x86_64'
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -x os7
      - name: Build actual x86 emulator app and tests
        working-directory: app
        run: ./gradlew --no-daemon --max-workers=2 -PunsignedRelease=true -PincludePersonalOverlay=false -Pos7CloudPreview=true -PnanoEmulatorBuild=true :app:assemblePreview
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: os7-emulator-apks
          path: |
            app/app/build/outputs/apk/preview/app-preview.apk
            app/app/build/outputs/apk/androidTest/preview/app-preview-androidTest.apk
          retention-days: 3
      - name: Enable approved acceleration for this run
        if: contains(github.event.head_commit.message, '[personal-kvm-20261112]') && github.run_attempt == 1
        run: |
          getfacl -p /dev/kvm > "$RUNNER_TEMP/os7-kvm.acl"
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check
      - name: Boot and test actual UI
        run: |
          mkdir -p emulator-evidence
          "$ANDROID_HOME/emulator/emulator" -avd os7 -memory 2048 -cores 2 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -accel on > emulator-evidence/emulator.log 2>&1 &
          timeout 600 adb wait-for-device
          timeout 600 bash -c 'until adb shell getprop sys.boot_completed | grep -q 1; do sleep 5; done'
          adb shell input keyevent 82
          adb install app/app/build/outputs/apk/preview/app-preview.apk
          python3 tools/os7_cloud_smoke.py
      - name: Restore temporary runner access
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/os7-kvm.acl"; then
            timeout 30 adb emu kill || true
            sudo setfacl --restore="$RUNNER_TEMP/os7-kvm.acl"
            getfacl -p /dev/kvm > "$RUNNER_TEMP/os7-kvm-restored.acl"
            diff -u "$RUNNER_TEMP/os7-kvm.acl" "$RUNNER_TEMP/os7-kvm-restored.acl"
          fi
      - name: Collect visual and frame evidence
        if: always()
        run: |
          mkdir -p emulator-evidence
          adb pull /sdcard/Android/data/ai.nanosearch.launcher.os7personal2/files/os7-cloud-qa emulator-evidence/ || true
          adb shell dumpsys gfxinfo ai.nanosearch.launcher.os7personal2 framestats > emulator-evidence/gfxinfo.txt || true
          cp /tmp/emulator.log /tmp/instrumentation.txt emulator-evidence/ 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: os7-emulator-evidence
          path: emulator-evidence/
          retention-days: 7
